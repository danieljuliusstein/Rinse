# fly.toml app configuration file generated for rinse-campaign-mail
#
# Deploy from this directory:
#   fly apps create rinse-campaign-mail
#   fly secrets set ...   # or ./scripts/fly-set-secrets.sh
#   fly deploy

app = "rinse-campaign-mail"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
